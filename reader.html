<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mimick</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<!-- The voice wants threads (step 4c), and threads want cross-origin
     isolation, which GitHub Pages can only get from this shim. -->
<script src="coi-serviceworker.js"></script>
<style>
  /* The desktop app's colours, from mimick/ui/theme.py. It is dark only, and so
     is this, for now. */
  :root {
    color-scheme: dark;
    --backdrop: #101216; --panel: #191d24; --panel-hi: #222732; --border: #2b313d;
    --text: #e7eaf0; --dim: #98a1b3; --accent: #5b9dff; --hover: #2b3140; --pressed: #333b4d;
    --disabled: #5c6577;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-rows: auto auto 1fr auto auto; background: var(--backdrop); color: var(--text);
         font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }

  .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
         padding: 8px 14px; background: var(--panel); }
  header.bar { border-bottom: 1px solid var(--border); }
  footer.bar { border-top: 1px solid var(--border); padding-bottom: 10px; }
  .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .centre { display: flex; align-items: center; gap: 8px; }
  .right { display: flex; align-items: center; gap: 8px; justify-content: flex-end; min-width: 0; }
  .brand { font-weight: 600; letter-spacing: .2px; }
  .dim { color: var(--dim); }
  #title { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  button, input, select { font: inherit; color: var(--text); background: var(--panel-hi);
                  border: 1px solid var(--border); border-radius: 6px; }
  button { padding: 5px 12px; cursor: pointer; }
  button:hover { background: var(--hover); border-color: #3a4152; }
  button:active { background: var(--pressed); }
  button:disabled { color: var(--disabled); background: #1c2029; cursor: default; }
  button.square { width: 32px; padding: 5px 0; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b1220; font-weight: 600; }
  button.primary:hover { background: #6fa9ff; }
  button.primary:disabled { background: #1c2029; border-color: var(--border); color: var(--disabled); }
  input[type=number] { width: 64px; padding: 5px 6px; text-align: right; }
  input[type=range] { width: 120px; accent-color: var(--accent); }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  #main { position: relative; display: grid; grid-template-columns: 1fr auto; min-height: 0; }
  #view { position: relative; overflow: auto; outline: none; }
  #view::-webkit-scrollbar { width: 12px; height: 12px; }
  #view::-webkit-scrollbar-thumb { background: #39404f; border-radius: 6px; border: 2px solid var(--backdrop); }
  #view::-webkit-scrollbar-thumb:hover { background: #495265; }
  #view::-webkit-scrollbar-corner { background: var(--backdrop); }
  #pages { position: relative; }
  .page { position: absolute; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .page canvas { width: 100%; height: 100%; display: block; }
  /* The reading highlight, in the desktop's SENTENCE_TINT and WORD_TINT. */
  .page .hl { position: absolute; pointer-events: none; }
  .page .hl.sentence { background: rgba(91, 157, 255, .19); }
  .page .hl.word { background: rgba(255, 190, 60, .51); border-radius: 2px; }
  .page .hl.selection { background: rgba(120, 200, 255, .27); border-radius: 3px; }
  /* The text cursor, in the desktop's CARET; it blinks unless the voice is reading. */
  .page .caret { position: absolute; width: 2px; margin-left: -1px; background: #7fb4ff; pointer-events: none;
                 animation: blink 1s steps(1) infinite; }
  #pages.reading .caret { animation: none; }
  @keyframes blink { 50% { opacity: 0; } }
  #pages { user-select: none; -webkit-user-select: none; }

  /* Highlights, in their own colour, under everything else that is lit. */
  .page .hl.annot { border-radius: 2px; }
  .page .remove, .note-card .remove { position: absolute; display: grid; place-items: center; padding: 0; line-height: 1;
                                 border-radius: 50%; cursor: pointer; font-size: 14px; }
  .page .remove { background: #fafafc; color: #5a606e; border: 1.2px solid #78808e; z-index: 2; }
  .page .remove:hover { background: #fff; color: #000; }

  /* The notes panel: the current page's notes, stacked, beside the page. */
  #notes { width: 272px; display: grid; grid-template-rows: auto 1fr auto; min-height: 0;
           background: #1a1d23; border-left: 1px solid var(--border); }
  .notes-head, .notes-foot { display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; }
  .notes-foot { flex-direction: row; align-items: center; flex-wrap: wrap; padding-bottom: 10px; }
  .notes-foot #note-count { flex: 1; }
  #notes-kept { width: 100%; font-size: 11px; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row .grow { flex: 1; }
  .chip { flex: 1; background: transparent; color: var(--dim); font-size: 12px; white-space: pre; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #0b1220; }
  #cards { overflow-y: auto; padding: 8px 18px; display: flex; flex-direction: column; gap: 8px; line-height: 1.3; }
  .note-card { position: relative; background: var(--panel); border-radius: 7px; padding: 10px 10px 10px 13px;
          cursor: default; overflow-wrap: anywhere; white-space: pre-wrap; border: 1.4px solid transparent; }
  .note-card::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 2px;
                  background: var(--accent); }
  .note-card.picked { background: var(--panel-hi); border-color: var(--accent); padding-right: 30px; }
  .note-card .heading { font-weight: 700; margin-bottom: 2px; }
  .note-card .quote { color: var(--dim); font-style: italic; }
  .note-card .remove { top: 6px; right: 6px; width: 18px; height: 18px; background: none; border: 0; color: var(--dim); }
  .note-card .remove:hover { color: var(--text); background: var(--hover); }
  #connectors { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: hidden; }
  #connectors line { stroke-width: 1.2; }

  /* Highlight and Add note: one strip, in one of four places. */
  .strip { display: flex; padding: 4px 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
  #markup-bottom { border-bottom: 0; border-top: 1px solid var(--border); }
  #markup { display: flex; align-items: center; gap: 6px; }
  #markup[data-home="panel"] { flex-direction: column; align-items: stretch; }
  #markup[data-home="float"] { position: absolute; z-index: 5; padding: 6px 8px; background: var(--panel);
                               border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  #markup.dragging { opacity: .9; }
  #markup.dragging[data-aim="panel"], #markup.dragging[data-aim="top"], #markup.dragging[data-aim="bottom"] {
    outline: 2px dashed var(--accent); }
  #markup-grip { color: var(--dim); font-size: 15px; cursor: grab; user-select: none; padding: 0 4px; text-align: center;
                 touch-action: none; }
  #markup[data-home="panel"] #markup-grip { line-height: .6; }
  #markup.dragging #markup-grip { cursor: grabbing; }
  .pair { display: flex; gap: 4px; }
  .pair #markup-highlight { flex: 1; }
  #markup-colour, .swatch { width: 44px; }
  #markup-colour::after, .swatch::after { content: ""; display: inline-block; width: 14px; height: 14px; border-radius: 50%;
                                          background: var(--swatch); vertical-align: middle; }
  .swatch[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }

  dialog { color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
           padding: 18px 20px 16px; width: min(460px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog form { display: flex; flex-direction: column; gap: 12px; margin: 0; }
  dialog input[type=text], dialog textarea, dialog input[type=number] { width: 100%; padding: 6px 8px; text-align: left; }
  dialog textarea { min-height: 110px; resize: vertical; font: inherit; color: var(--text); background: var(--panel-hi);
                    border: 1px solid var(--border); border-radius: 6px; }
  dialog label { display: grid; gap: 4px; }
  dialog .buttons { display: flex; gap: 8px; justify-content: flex-end; }
  #style-sample { background: #1a1d23; padding: 10px; border-radius: 7px; }
  #style-sample .note-card { cursor: default; }

  #menu { position: fixed; z-index: 10; min-width: 220px; padding: 4px; background: var(--panel);
          border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
  #menu button { display: flex; justify-content: space-between; gap: 24px; width: 100%; text-align: left;
                 background: none; border: 0; border-radius: 5px; padding: 6px 10px; }
  #menu button:hover:not(:disabled), #menu button:focus-visible { background: var(--hover); outline: none; }
  #menu button:disabled { background: none; }
  #menu .keys { color: var(--dim); }
  #menu .check { width: 14px; display: inline-block; color: var(--accent); }
  #menu .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: -1px; }
  #menu .label { flex: 1; }
  #menu .label.indent { padding-left: 18px; }
  #menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 2px; }
  #play { min-width: 130px; }
  select { padding: 4px 6px; }

  #empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
  #empty .card { max-width: 420px; }
  #empty h1 { font-size: 20px; margin: 0 0 8px; }
  #empty p { margin: 0 0 16px; color: var(--dim); }
  #empty .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #view.dragging { box-shadow: inset 0 0 0 3px var(--accent); }
  [hidden] { display: none !important; }
</style>

<header class="bar">
  <div class="left">
    <span class="brand">Mimick</span>
    <button id="open" title="Open a PDF  (Ctrl+O)">Open…</button>
    <button id="notes-menu" title="Highlights and notes">Notes ▾</button>
    <button id="display-menu" title="What is shown, and where">Display ▾</button>
    <input id="file" type="file" accept="application/pdf,.pdf" hidden>
    <label class="dim" for="speed">Speed</label>
    <select id="speed" title="How fast the voice reads"></select>
  </div>
  <div class="centre">
    <button id="back" class="square" title="Previous sentence  (←)" disabled>↶</button>
    <button id="play" class="primary" title="Start or pause reading  (Space)" disabled>Read aloud</button>
    <button id="forward" class="square" title="Next sentence  (→)" disabled>↷</button>
  </div>
  <div class="right">
    <span id="title" class="dim"></span>
    <a class="dim" href="https://github.com/kathollander/mimick-web" target="_blank" rel="noopener">Source</a>
  </div>
</header>

<div id="markup-top" class="strip" hidden></div>

<div id="main">
<div id="view" tabindex="0">
  <div id="pages"></div>
  <div id="empty">
    <div class="card">
      <h1>Open a PDF to begin</h1>
      <p>It opens in this tab and stays on your computer. Nothing is uploaded.</p>
      <div class="actions">
        <button id="open-empty" class="primary">Open a PDF…</button>
      </div>
      <p style="margin-top:14px">Or drop a PDF anywhere on this page.</p>
    </div>
  </div>
</div>

<aside id="notes" aria-label="Notes">
  <div class="notes-head">
    <div class="row">
      <button id="filter-quotes" class="chip" aria-pressed="true" title="Show passages you highlighted without writing anything">Highlights</button>
      <button id="filter-notes" class="chip" aria-pressed="true" title="Show the ones you wrote a note on">Notes</button>
    </div>
    <div id="markup-panel">
      <div id="markup" data-home="panel">
        <span id="markup-grip" title="Drag to move these buttons — the top or bottom of the page, the notes panel, or loose over the page">⋯</span>
        <button id="markup-note" title="Highlight the selected text and write a note  (Ctrl+M)" disabled>+  Add note</button>
        <div class="pair">
          <button id="markup-highlight" title="Highlight the selected text  (Ctrl+H)" disabled>Highlight</button>
          <button id="markup-colour" title="Highlight colour" aria-label="Highlight colour" disabled></button>
        </div>
      </div>
    </div>
    <div class="row">
      <span class="grow"></span>
      <button id="prev-note" class="square" title="Previous note  (Ctrl+K)" disabled>‹</button>
      <button id="next-note" class="square" title="Next note  (Ctrl+J)" disabled>›</button>
      <button id="note-style" class="square" title="How notes look — typeface and size">⚙</button>
    </div>
  </div>
  <div id="cards"></div>
  <div id="notes-foot" class="notes-foot" hidden>
    <span id="note-count" class="dim"></span>
    <button id="notes-download" title="Download this PDF with your highlights and notes in it  (Ctrl+S)">Download a copy</button>
    <span id="notes-kept" class="dim"></span>
  </div>
</aside>
<svg id="connectors" aria-hidden="true"></svg>
</div>

<div id="markup-bottom" class="strip" hidden></div>

<dialog id="note-dialog" aria-label="Note">
  <form id="note-form" method="dialog">
    <div id="note-quote" class="dim"></div>
    <input id="note-title" type="text" placeholder="Heading (optional) — shown by other PDF readers">
    <textarea id="note-text" placeholder="Write your note here…"></textarea>
    <div class="row"><span>Colour</span><span id="note-colours" class="row"></span><span class="grow"></span>
      <button id="note-delete" type="button" title="Remove this highlight and its note">Delete highlight</button></div>
    <div class="buttons">
      <button id="note-cancel" type="button">Cancel</button>
      <button class="primary" type="submit" title="Save  (Ctrl+Enter)">Save</button>
    </div>
  </form>
</dialog>

<dialog id="style-dialog" aria-label="Note appearance">
  <form id="style-form" method="dialog">
    <div class="dim">How notes are written in the margin beside the page.</div>
    <label>Typeface <input id="style-font" type="text" list="fonts" placeholder="The interface's own"></label>
    <datalist id="fonts">
      <option value="Georgia"><option value="Times New Roman"><option value="Palatino"><option value="Arial">
      <option value="Verdana"><option value="Trebuchet MS"><option value="Courier New"><option value="serif">
      <option value="sans-serif"><option value="monospace">
    </datalist>
    <label>Size, in points at 100% — notes grow and shrink with the page
      <input id="style-size" type="number" min="6" max="24" step="0.5"></label>
    <label>Your name — saved with each highlight; other PDF readers show it
      <input id="style-author" type="text" placeholder="Your name"></label>
    <div id="style-sample"><div class="note-card" style="--accent: rgb(255, 222, 89)">Foucault's point here is about normalisation, not repression.</div></div>
    <div class="buttons">
      <button id="style-cancel" type="button">Cancel</button>
      <button class="primary" type="submit">Done</button>
    </div>
  </form>
</dialog>

<div id="menu" role="menu" hidden></div>

<footer class="bar">
  <div class="left"><span id="status" class="dim">Getting ready…</span></div>
  <div class="centre">
    <button id="prev" class="square" title="Previous page  (Page Up)" disabled>‹</button>
    <input id="page" type="number" min="1" value="1" title="Jump to page" disabled>
    <span id="total" class="dim">of —</span>
    <button id="next" class="square" title="Next page  (Page Down)" disabled>›</button>
  </div>
  <div class="right">
    <button id="zoom-out" class="square" title="Zoom out  (Ctrl+−)">−</button>
    <input id="zoom-slider" type="range" min="40" max="400" step="1" title="Zoom">
    <button id="zoom-in" class="square" title="Zoom in  (Ctrl++)">+</button>
    <input id="zoom" type="number" min="40" max="400" step="1" title="Zoom, in per cent">
    <span class="dim">%</span>
  </div>
</footer>

<script src="js/page-layout.js"></script>
<script src="js/page-store.js"></script>
<script src="js/piper-core.js"></script>
<script src="js/read-aloud.js"></script>
<script src="js/notes-store.js"></script>
<script src="js/notes.js"></script>
<script src="js/reader.js"></script>
</html>
