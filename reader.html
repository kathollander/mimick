<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mimick</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<!-- The voice wants threads (step 4c), and threads want cross-origin
     isolation, which GitHub Pages can only get from this shim. -->
<script src="coi-serviceworker.js"></script>
<style>
  /* The desktop app's colours, from mimick/ui/theme.py. It is dark only, and so
     is this, for now. */
  :root {
    color-scheme: dark;
    --backdrop: #101216; --panel: #191d24; --panel-hi: #222732; --border: #2b313d;
    --text: #e7eaf0; --dim: #98a1b3; --accent: #5b9dff; --hover: #2b3140; --pressed: #333b4d;
    --disabled: #5c6577;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-rows: auto 1fr auto; background: var(--backdrop); color: var(--text);
         font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }

  .bar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
         padding: 8px 14px; background: var(--panel); }
  header.bar { border-bottom: 1px solid var(--border); }
  footer.bar { border-top: 1px solid var(--border); padding-bottom: 10px; }
  .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .centre { display: flex; align-items: center; gap: 8px; }
  .right { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .brand { font-weight: 600; letter-spacing: .2px; }
  .dim { color: var(--dim); }
  #title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  button, input { font: inherit; color: var(--text); background: var(--panel-hi);
                  border: 1px solid var(--border); border-radius: 6px; }
  button { padding: 5px 12px; cursor: pointer; }
  button:hover { background: var(--hover); border-color: #3a4152; }
  button:active { background: var(--pressed); }
  button:disabled { color: var(--disabled); background: #1c2029; cursor: default; }
  button.square { width: 32px; padding: 5px 0; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0b1220; font-weight: 600; }
  button.primary:hover { background: #6fa9ff; }
  input[type=number] { width: 64px; padding: 5px 6px; text-align: right; }
  input[type=range] { width: 120px; accent-color: var(--accent); }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  #view { position: relative; overflow: auto; outline: none; }
  #view::-webkit-scrollbar { width: 12px; height: 12px; }
  #view::-webkit-scrollbar-thumb { background: #39404f; border-radius: 6px; border: 2px solid var(--backdrop); }
  #view::-webkit-scrollbar-thumb:hover { background: #495265; }
  #view::-webkit-scrollbar-corner { background: var(--backdrop); }
  #pages { position: relative; }
  .page { position: absolute; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .page canvas { width: 100%; height: 100%; display: block; }

  #empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
  #empty .card { max-width: 420px; }
  #empty h1 { font-size: 20px; margin: 0 0 8px; }
  #empty p { margin: 0 0 16px; color: var(--dim); }
  #empty .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #view.dragging { box-shadow: inset 0 0 0 3px var(--accent); }
  [hidden] { display: none !important; }
</style>

<header class="bar">
  <div class="left">
    <span class="brand">Mimick</span>
    <button id="open" title="Open a PDF  (Ctrl+O)">Open…</button>
    <input id="file" type="file" accept="application/pdf,.pdf" hidden>
  </div>
  <div class="centre"><span id="title" class="dim"></span></div>
  <div class="right">
    <a class="dim" href="https://github.com/kathollander/mimick-web" target="_blank" rel="noopener">Source</a>
  </div>
</header>

<div id="view" tabindex="0">
  <div id="pages"></div>
  <div id="empty">
    <div class="card">
      <h1>Open a PDF to begin</h1>
      <p>It opens in this tab and stays on your computer. Nothing is uploaded.</p>
      <div class="actions">
        <button id="open-empty" class="primary">Open a PDF…</button>
      </div>
      <p style="margin-top:14px">Or drop a PDF anywhere on this page.</p>
    </div>
  </div>
</div>

<footer class="bar">
  <div class="left"><span id="status" class="dim">Getting ready…</span></div>
  <div class="centre">
    <button id="prev" class="square" title="Previous page  (Page Up)" disabled>‹</button>
    <input id="page" type="number" min="1" value="1" title="Jump to page" disabled>
    <span id="total" class="dim">of —</span>
    <button id="next" class="square" title="Next page  (Page Down)" disabled>›</button>
  </div>
  <div class="right">
    <button id="zoom-out" class="square" title="Zoom out  (Ctrl+−)">−</button>
    <input id="zoom-slider" type="range" min="40" max="400" step="1" title="Zoom">
    <button id="zoom-in" class="square" title="Zoom in  (Ctrl++)">+</button>
    <input id="zoom" type="number" min="40" max="400" step="1" title="Zoom, in per cent">
    <span class="dim">%</span>
  </div>
</footer>

<script src="js/page-layout.js"></script>
<script src="js/page-store.js"></script>
<script src="js/reader.js"></script>
</html>
